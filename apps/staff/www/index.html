<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('ob-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e60023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cue Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><img class="logo-mark" src="img/logo.png" width="36" height="36" alt="">Cue Staff</div>
  <div class="acts">
    <button class="ib" id="themeBtn" type="button" aria-label="Toggle color theme">Light</button>
    <button class="ib" id="snd" aria-pressed="false">Sound off</button>
  </div>
</header>
<main>
  <section id="v-admin">
    <div class="staff">
      <div class="panel">
        <div class="entry ph" id="entry">Type a token</div>
        <div class="keys" id="keys"></div>
        <div class="btnrow"><button class="btn red" id="mainBtn" disabled>Add token</button><button class="btn" id="handRem" hidden>Cancel order</button></div>
        <button class="btn red big quick-oldest" id="quickOldest" type="button" hidden>Mark ready</button>
        <p class="hint" id="keyHint"></p>
        <div class="gen"><span>Next number</span><b id="genNum">1</b><button class="btn red" id="genBtn">Give this token</button><button class="link" id="genReset">Restart at 1</button></div>
      </div>
      <div class="panel">
        <h2 class="sec-plain" id="prepH">Up next</h2>
        <p class="hint sec-hint" id="prepHint">Oldest is highlighted — tap when ready.</p>
        <div class="tiles" id="tiles"></div>
        <button class="link" id="moreP" hidden></button>
        <div id="offWrap" hidden>
          <div class="rhead"><h2 class="sec-plain" id="readyH">Ready — tap when handed over</h2><button class="link" id="clearReady">Clear all</button></div>
          <p class="hint sec-hint">Removes it from the student view.</p>
          <div class="tiles" id="offTiles"></div>
          <button class="link" id="moreR" hidden></button>
        </div>
        <p class="hint sync-foot" id="sync"></p>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo">Undo</button></div>
<script src="vendor/capacitor.js"></script>
<script src="vendor/app.js"></script>
<script src="vendor/haptics.js"></script>
<script src="vendor/preferences.js"></script>
<script src="vendor/splash-screen.js"></script>
<script src="vendor/status-bar.js"></script>
<script src="vendor/local-notifications.js"></script>
<script src="vendor/keep-awake.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/native.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
