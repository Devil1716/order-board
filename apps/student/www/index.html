<!DOCTYPE html>
<html lang="en">
<head>
<script>(function(){try{var t=localStorage.getItem('ob-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e60023">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><img class="logo-mark" src="img/logo.png" width="36" height="36" alt="">Cue</div>
  <div class="acts">
    <button class="ib" id="themeBtn" type="button" aria-label="Toggle color theme">Light</button>
    <button class="ib" id="snd" aria-pressed="false">Sound off</button>
  </div>
</header>
<main>
  <section id="v-cust">
    <!-- Empty: one focused job — enter token -->
    <div class="focus-empty" id="focusEmpty">
      <h1 class="focus-title">Enter your token</h1>
      <p class="focus-why">We’ll tell you when your food is ready.</p>
      <input class="tokin" id="tokInEmpty" type="text" inputmode="numeric" maxlength="4" placeholder="000" aria-label="Your token number" autocomplete="off"><br>
      <button class="btn red" id="getTokEmpty">Track my order</button>
    </div>

    <!-- Tracking: my orders are the product -->
    <div class="mine" id="mine" hidden>
      <h2 class="sec-title ink" id="mineTitle">Your orders</h2>
      <div class="mine-list" id="mineList"></div>
      <div class="add-more" id="addTok">
        <p class="status" id="addTitle">Add another</p>
        <p class="sub" id="addSub">Same counter, another token.</p>
        <input class="tokin" id="tokIn" type="text" inputmode="numeric" maxlength="4" placeholder="000" aria-label="Another token number" autocomplete="off"><br>
        <button class="btn red" id="getTok">Add order</button>
      </div>
    </div>

    <!-- Secondary context: compact ready strip (not a masonry wall) -->
    <div class="ready-context" id="readyContext">
      <h2 class="sec-title" id="readyTitle">What’s ready</h2>
      <div class="strip" id="strip"></div>
    </div>

    <p class="sync-foot" id="sync"></p>
  </section>
</main>
<div class="alert" id="alert" role="alertdialog" aria-labelledby="alH" hidden>
  <h1 id="alH">Your order is ready</h1>
  <div class="n" id="alN">0</div>
  <p>Please collect it from the counter.</p>
  <button class="btn" id="gotit">Got it</button>
</div>
<script src="vendor/capacitor.js"></script>
<script src="vendor/app.js"></script>
<script src="vendor/haptics.js"></script>
<script src="vendor/preferences.js"></script>
<script src="vendor/splash-screen.js"></script>
<script src="vendor/status-bar.js"></script>
<script src="vendor/local-notifications.js"></script>
<script src="vendor/keep-awake.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/native.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
