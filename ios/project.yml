name: Cue
options:
  bundleIdPrefix: in.sharan.orderboard
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO

packages:
  CueCore:
    path: CueCore

targets:
  Cue:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Cue
    dependencies:
      - package: CueCore
        product: CueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.sharan.orderboard
        PRODUCT_NAME: Cue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cue
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Cue notifies you when your order is ready for pickup."
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""

  CueStaff:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CueStaff
    dependencies:
      - package: CueCore
        product: CueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.sharan.orderboard.staff
        PRODUCT_NAME: CueStaff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Cue Staff"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""

  CueCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CueCore/Tests/CueCoreTests
    dependencies:
      - package: CueCore
        product: CueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.sharan.orderboard.CueCoreTests
        PRODUCT_NAME: CueCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cue:
    build:
      targets:
        Cue: all
    test:
      targets:
        - CueCoreTests
    run:
      config: Debug
  CueStaff:
    build:
      targets:
        CueStaff: all
    test:
      targets:
        - CueCoreTests
    run:
      config: Debug
  CueCoreTests:
    build:
      targets:
        CueCoreTests: all
    test:
      targets:
        - CueCoreTests
