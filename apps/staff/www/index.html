<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Order Board Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="dot">#</span>Order Board Staff</div>
  <div class="acts">
    <button class="ib" id="snd" aria-pressed="false" aria-label="Toggle sound">Sound off</button>
  </div>
</header>
<main>
  <section id="v-admin">
    <div class="staff">
      <div class="panel">
        <div class="entry ph" id="entry">Type a token number</div>
        <div class="keys" id="keys"></div>
        <div class="btnrow">
          <button class="btn red" id="mainBtn" disabled>Add token</button>
          <button class="btn ghost" id="handRem" hidden>Cancel order</button>
        </div>
        <p class="hint" id="keyHint"></p>
        <div class="gen">
          <span>Next number (1 to 150, reused)</span>
          <b id="genNum">1</b>
          <button class="btn red" id="genBtn">Give this token</button>
          <button class="link" id="genReset">Restart numbering at 1</button>
        </div>
      </div>
      <div class="panel">
        <h2 id="prepH" style="margin:0 0 4px;font-size:18px">Preparing</h2>
        <p class="hint" id="prepHint" style="margin:0 0 14px"></p>
        <div class="tiles" id="tiles"></div>
        <button class="link" id="moreP" hidden></button>
        <div id="offWrap" hidden>
          <div class="rhead">
            <h2 id="readyH" style="margin:0;font-size:18px">Ready on the board</h2>
            <button class="link" id="clearReady" style="padding:0">Clear all</button>
          </div>
          <p class="hint" style="margin:4px 0 12px">Tap a token when it has been handed over.</p>
          <div class="tiles" id="offTiles"></div>
          <button class="link" id="moreR" hidden></button>
        </div>
        <p class="hint" id="sync"></p>
      </div>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undo">Undo</button></div>
<script src="vendor/capacitor.js"></script>
<script src="vendor/app.js"></script>
<script src="vendor/haptics.js"></script>
<script src="vendor/preferences.js"></script>
<script src="vendor/splash-screen.js"></script>
<script src="vendor/status-bar.js"></script>
<script src="vendor/local-notifications.js"></script>
<script src="vendor/keep-awake.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/native.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
