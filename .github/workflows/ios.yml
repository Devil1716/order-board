name: Build iOS + Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Native iOS Unit Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CueCore Unit Tests
        run: |
          set -euo pipefail
          DEVICE_DEST=$(xcrun simctl list devices available | grep -m 1 -E "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/id=\1/' || true)
          if [ -z "$DEVICE_DEST" ]; then
            DEST="generic/platform=iOS Simulator"
            ACTION="build-for-testing"
          else
            DEST="platform=iOS Simulator,$DEVICE_DEST"
            ACTION="test"
          fi
          echo "Testing with destination: $DEST"
          xcodebuild \
            -workspace ios/Cue.xcworkspace \
            -scheme CueCoreTests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DEST" \
            $ACTION \
            CODE_SIGNING_ALLOWED=NO

  simulator:
    name: Simulator (${{ matrix.name }})
    needs: [unit-tests]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Cue
            name: student
            app_name: Cue.app
            artifact: Cue-student-ios-simulator
          - scheme: CueStaff
            name: staff
            app_name: CueStaff.app
            artifact: Cue-staff-ios-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Cue.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .app artifact
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -name "${{ matrix.app_name }}" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "${{ matrix.app_name }} not found under build/Build/Products"
            find build -type d -name '*.app' || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/${{ matrix.artifact }}.zip
          ls -lh artifacts/

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: |
          ln -sfn ../../node_modules apps/student/node_modules
          ln -sfn ../../node_modules apps/staff/node_modules
      - run: npm run sync-shared
      - name: Build APKs
        run: |
          set -euo pipefail
          mkdir -p out
          for a in student staff; do
            (cd apps/$a && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
            cp apps/$a/android/app/build/outputs/apk/debug/app-debug.apk out/Cue-$a-debug.apk
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Cue-android-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  signing-gate:
    name: Check Apple signing secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - name: Probe secrets
        id: probe
        env:
          CERT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASS" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Device IPA skipped::Apple signing secrets are not set. Simulator builds for Student + Staff still run. See README."
          fi

  device-ipa-notice:
    name: Device IPA (needs certs per app)
    runs-on: ubuntu-latest
    needs: [simulator, signing-gate]
    if: needs.signing-gate.outputs.ready == 'true'
    steps:
      - name: Notice
        run: |
          echo "::notice title=Device IPA::Signing secrets exist, but this monorepo needs separate provisioning profiles for in.sharan.orderboard and in.sharan.orderboard.staff. Extend the workflow once both profiles are available."
