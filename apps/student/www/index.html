<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Order Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="dot">#</span>Order Board</div>
  <div class="acts">
    <button class="ib" id="snd" aria-pressed="false" aria-label="Toggle sound">Sound off</button>
  </div>
</header>
<main>
  <section id="v-cust">
    <div class="mine" id="mine">
      <div id="noTok">
        <p class="status" style="margin-top:0">Enter your token</p>
        <p class="sub">Type the number you were given and we’ll alert you when it’s ready.</p>
        <input class="tokin" id="tokIn" type="text" inputmode="numeric" maxlength="4" placeholder="000" aria-label="Your token number" autocomplete="off"><br>
        <button class="btn red" id="getTok">Track my order</button>
      </div>
      <div id="hasTok" hidden>
        <div class="badge waiting" id="mBadge">Waiting</div>
        <div class="lbl-quiet">Your token</div>
        <div class="mytok" id="myNum">0</div>
        <p class="status" id="mStatus"></p>
        <p class="sub" id="mSub"></p>
        <button class="btn red" id="alertsBtn" hidden>Alert me when it’s ready</button>
        <button class="btn red" id="collBtn" hidden>I’ve collected my order</button>
        <button class="btn ghost" id="againBtn" hidden>Order again</button>
      </div>
    </div>
    <div class="hero is-empty" id="hero">
      <small id="heroLbl">No orders ready yet</small>
      <div class="num" id="heroNum">···</div>
      <div class="ctr" id="heroCtr">When staff mark an order ready, it shows up here.</div>
    </div>
    <div class="prepbar" id="prepbar" hidden></div>
    <div class="section-head"><h2>Ready to collect</h2></div>
    <div class="grid" id="grid"></div>
    <p class="hint" id="sync" style="margin-top:20px;text-align:center"></p>
  </section>
</main>
<div class="alert" id="alert" role="alertdialog" aria-labelledby="alH" hidden>
  <h1 id="alH">Your order is ready</h1>
  <div class="n" id="alN">0</div>
  <p>Please collect it from the counter.</p>
  <button class="btn" id="gotit">Got it</button>
</div>
<script src="vendor/capacitor.js"></script>
<script src="vendor/app.js"></script>
<script src="vendor/haptics.js"></script>
<script src="vendor/preferences.js"></script>
<script src="vendor/splash-screen.js"></script>
<script src="vendor/status-bar.js"></script>
<script src="vendor/local-notifications.js"></script>
<script src="vendor/keep-awake.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/native.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
