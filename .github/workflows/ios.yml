name: Build iOS + Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Native iOS Unit Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CueCore Unit Tests
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcodebuild -workspace ios/Cue.xcworkspace -scheme CueCoreTests -showdestinations 2>/dev/null | grep "platform:iOS Simulator" | grep -m 1 -oE 'id:[A-F0-9-]+' | cut -d: -f2 || true)
          if [ -n "$DEVICE_ID" ]; then
            DEST="id=$DEVICE_ID"
            ACTION="test"
          else
            DEST="generic/platform=iOS Simulator"
            ACTION="build-for-testing"
          fi
          echo "Testing with destination: $DEST"
          xcodebuild \
            -workspace ios/Cue.xcworkspace \
            -scheme CueCoreTests \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "$DEST" \
            $ACTION \
            CODE_SIGNING_ALLOWED=NO

  simulator:
    name: Simulator (${{ matrix.name }})
    needs: [unit-tests]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Cue
            name: student
            app_name: Cue.app
            artifact: Cue-student-ios-simulator
          - scheme: CueStaff
            name: staff
            app_name: CueStaff.app
            artifact: Cue-staff-ios-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Firebase config (GoogleService-Info plist from secret)
        env:
          PLIST_B64: ${{ matrix.name == 'student' && secrets.IOS_GOOGLE_SERVICE_INFO_STUDENT_BASE64 || secrets.IOS_GOOGLE_SERVICE_INFO_STAFF_BASE64 }}
        run: |
          set -euo pipefail
          TARGET_FILE="ios/GoogleService-Info-${{ matrix.name }}.plist"
          if [ -n "$PLIST_B64" ]; then
            printf '%s' "$PLIST_B64" | base64 --decode > "$TARGET_FILE"
            plutil -lint "$TARGET_FILE" >/dev/null
            echo "::notice title=Firebase ENABLED (${{ matrix.name }})::Plist written from the IOS_GOOGLE_SERVICE_INFO_*_BASE64 secret (not committed)."
          else
            echo "::warning title=Firebase config missing (${{ matrix.name }})::Secret IOS_GOOGLE_SERVICE_INFO_$(echo '${{ matrix.name }}' | tr a-z A-Z)_BASE64 is not available (e.g. a PR from a fork). Building in LOCAL mode with no Firebase."
          fi

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Cue.xcworkspace \
            -scheme ${{ matrix.scheme }} \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            clean build \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Firebase config in the built app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -name "${{ matrix.app_name }}" | head -n 1)
          BUILT="$APP_PATH/GoogleService-Info.plist"
          SRC="ios/GoogleService-Info-${{ matrix.name }}.plist"
          if [ -f "$SRC" ]; then
            test -f "$BUILT" || { echo "::error::Plist was provided but is missing from the built app"; exit 1; }
            PID=$(/usr/libexec/PlistBuddy -c "Print :PROJECT_ID" "$BUILT")
            BID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$BUILT")
            echo "Built app uses Firebase project: $PID, bundle id: $BID"
            test "$PID" = "cue-orderboard-sharan" || { echo "::error::Unexpected Firebase project $PID"; exit 1; }
          else
            test ! -f "$BUILT" || { echo "::error::Built app contains a plist that was not provided"; exit 1; }
            echo "Local mode build confirmed (no plist in the app)."
          fi

      - name: Package .app artifact
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -type d -name "${{ matrix.app_name }}" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "${{ matrix.app_name }} not found under build/Build/Products"
            find build -type d -name '*.app' || true
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/${{ matrix.artifact }}.zip
          ls -lh artifacts/

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: |
          ln -sfn ../../node_modules apps/student/node_modules
          ln -sfn ../../node_modules apps/staff/node_modules
      - name: Unit tests (token rules + store)
        run: npm test
      - run: npm run sync-shared
      - name: Build APKs
        run: |
          set -euo pipefail
          mkdir -p out
          for a in student staff; do
            (cd apps/$a && npx cap sync android && cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
            cp apps/$a/android/app/build/outputs/apk/debug/app-debug.apk out/Cue-$a-debug.apk
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Cue-android-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Run rules tests against the Firestore emulator
        run: npm run test:rules

  signing-gate:
    name: Check Apple signing secrets
    runs-on: ubuntu-latest
    steps:
      - name: Probe secrets
        env:
          CERT: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_BUILD_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PASS" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "::notice title=Device Signing::Apple signing secrets are present. Extend this job to export signed IPAs once per-app provisioning profiles are added."
          else
            echo "::notice title=Device IPA skipped::Apple signing secrets are not set. Simulator builds for Student + Staff still run. See README."
          fi
