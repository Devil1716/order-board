name: Cue
options:
  bundleIdPrefix: in.sharan.orderboard
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  CueCore:
    path: CueCore

targets:
  Cue:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Cue
    dependencies:
      - package: CueCore
        product: CueCore
    postBuildScripts:
      - name: Copy Firebase Config if Present
        basedOnDependencyAnalysis: false
        script: |
          # Per-app Firebase config: GoogleService-Info-student.plist (git-ignored; CI writes it from a base64 secret).
          # Falls back to a shared GoogleService-Info.plist, and to local mode (no Firebase) when neither exists.
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          SRC=""
          for CAND in "${SRCROOT}/GoogleService-Info-student.plist" "${SRCROOT}/GoogleService-Info.plist" "${SRCROOT}/../GoogleService-Info.plist"; do
            if [ -f "$CAND" ]; then SRC="$CAND"; break; fi
          done
          rm -f "$DEST"
          if [ -n "$SRC" ]; then
            PLIST_BUNDLE=`/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$SRC" 2>/dev/null || true`
            if [ -n "$PLIST_BUNDLE" ] && [ "$PLIST_BUNDLE" != "$PRODUCT_BUNDLE_IDENTIFIER" ]; then
              echo "error: ${SRC##*/} is for bundle id $PLIST_BUNDLE but this target is $PRODUCT_BUNDLE_IDENTIFIER"
              exit 1
            fi
            cp "$SRC" "$DEST"
            echo "note: Firebase ENABLED for student using ${SRC##*/}"
          else
            echo "warning: no GoogleService-Info plist found for student: building in LOCAL mode (no Firebase)"
          fi
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: in.sharan.orderboard
        PRODUCT_NAME: Cue
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Cue
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Cue notifies you when your order is ready for pickup."
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""

  CueStaff:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CueStaff
    dependencies:
      - package: CueCore
        product: CueCore
    postBuildScripts:
      - name: Copy Firebase Config if Present
        basedOnDependencyAnalysis: false
        script: |
          # Per-app Firebase config: GoogleService-Info-staff.plist (git-ignored; CI writes it from a base64 secret).
          # Falls back to a shared GoogleService-Info.plist, and to local mode (no Firebase) when neither exists.
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          SRC=""
          for CAND in "${SRCROOT}/GoogleService-Info-staff.plist" "${SRCROOT}/GoogleService-Info.plist" "${SRCROOT}/../GoogleService-Info.plist"; do
            if [ -f "$CAND" ]; then SRC="$CAND"; break; fi
          done
          rm -f "$DEST"
          if [ -n "$SRC" ]; then
            PLIST_BUNDLE=`/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" "$SRC" 2>/dev/null || true`
            if [ -n "$PLIST_BUNDLE" ] && [ "$PLIST_BUNDLE" != "$PRODUCT_BUNDLE_IDENTIFIER" ]; then
              echo "error: ${SRC##*/} is for bundle id $PLIST_BUNDLE but this target is $PRODUCT_BUNDLE_IDENTIFIER"
              exit 1
            fi
            cp "$SRC" "$DEST"
            echo "note: Firebase ENABLED for staff using ${SRC##*/}"
          else
            echo "warning: no GoogleService-Info plist found for staff: building in LOCAL mode (no Firebase)"
          fi
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: in.sharan.orderboard.staff
        PRODUCT_NAME: CueStaff
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Cue Staff"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""

  CueCoreTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CueCore/Tests/CueCoreTests
    dependencies:
      - package: CueCore
        product: CueCore
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: in.sharan.orderboard.CueCoreTests
        PRODUCT_NAME: CueCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Cue:
    build:
      targets:
        Cue: all
    test:
      targets:
        - CueCoreTests
    run:
      config: Debug
  CueStaff:
    build:
      targets:
        CueStaff: all
    test:
      targets:
        - CueCoreTests
    run:
      config: Debug
  CueCoreTests:
    build:
      targets:
        CueCoreTests: all
    test:
      targets:
        - CueCoreTests
